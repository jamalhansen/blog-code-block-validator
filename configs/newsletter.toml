# Configuration for validating BrainSync newsletter patterns.
# Previously lived in ~/projects/newsletter-pattern-validator/blog-validate.toml.
# Run via: make validate-newsletter

[blog]
content_path = "~/vaults/BrainSync/newsletter/patterns"
layout = "flat"
# newsletter-helpers/_ollama_mock.py replaces the `ollama` module before every
# pattern runs. Without it the patterns' `import ollama` hits the real local
# server and every assertion against a mock response fails.
helpers_path = "newsletter-helpers"
