[project]
name = "blog-code-block-validator"
version = "0.1.0"
description = "Validate code blocks in Hugo blog posts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.1",
    "typer>=0.24.1",
]

[project.scripts]
blog-validate = "blog_validate.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blog_validate"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=5.0",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
addopts = "--cov=blog_validate --cov-fail-under=50"
